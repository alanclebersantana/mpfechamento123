<!DOCTYPE html>
<html lang="pt-BR">
<head>
<base target="_top">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MP Grupo de Extratos — Milhas Plus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* Identidade visual do MP Financeiro (cores, listras, Caveat + Nunito, tema claro e escuro) */
:root{
  --ac:193,86,26;
  --bg:#F1F2F0;
  --sup:#E3E5E1;
  --line:#D5D8D2;
  --soft:#EAECE8;
  --card:#FBFCFA;
  --ink:#14181B;
  --fraco:#6B7370;
  --alerta:#9B5B10;
  --erro:#9B3B32;
  --marca:#F6E7D3;
  --erroFundo:#F7E3E0;
  --listra:rgba(20,24,27,.035);
  --verde:#3E8E5A;
  --mono:ui-monospace,'SFMono-Regular',Menlo,monospace;
}
body.escuro{
  --ac:226,126,64;
  --bg:#15181A;
  --sup:#1F2426;
  --line:#2E3538;
  --soft:#202628;
  --card:#1A1F21;
  --ink:#E9ECEA;
  --fraco:#98A29F;
  --alerta:#E0A653;
  --erro:#E08175;
  --marca:#3A2C1B;
  --erroFundo:#37201D;
  --listra:rgba(255,255,255,.028);
  --verde:#63B183;
  --mono:ui-monospace,'SFMono-Regular',Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:'Nunito',system-ui,sans-serif;
  color:var(--ink);background:var(--bg);
  font-size:16px;line-height:1.5;min-height:100vh;
  padding-bottom:26px;-webkit-text-size-adjust:100%;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:repeating-linear-gradient(135deg,var(--listra) 0 1px,transparent 1px 10px);
}
h1,h2,h3{margin:0;font-weight:700}
input,textarea,select,button{font-family:'Nunito',system-ui,sans-serif}
::placeholder{color:var(--fraco);opacity:.75}
:focus-visible{outline:2.5px solid rgb(var(--ac));outline-offset:2px}

/* ---------- barra do topo ---------- */
.topo{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  position:sticky;top:0;z-index:20;background:var(--sup);
  border-radius:0 0 18px 18px;padding:10px 16px;
}
.topo .logo{display:flex;align-items:center;gap:11px;min-width:0}
.topo img{width:36px;height:36px;border-radius:10px;display:block;flex:none}
.topo strong{
  display:block;font-family:'Caveat',cursive;font-weight:700;
  font-size:1.7rem;line-height:1;color:rgb(var(--ac));
}
.topo .logo span{font-size:.73rem;font-weight:700;color:var(--fraco)}
.tema{
  width:38px;height:38px;padding:0;flex:none;font-size:1rem;cursor:pointer;
  border-radius:999px;background:var(--bg);border:1.5px solid var(--line);color:var(--ink);
}
.pagina[hidden]{display:none}
.selo{
  font-size:.78rem;font-weight:800;color:var(--fraco);
  background:var(--sup);border-radius:999px;padding:6px 13px;white-space:nowrap;
}
/* ---------- página ---------- */
.app{max-width:none;margin:0;padding:0 clamp(4px,1.4vw,26px)}
.cabeca{
  display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;
  padding:26px 18px 4px;
}
.cabeca h2{font-family:'Caveat',cursive;font-weight:700;font-size:2.1rem;line-height:1;color:rgb(var(--ac))}
.cabeca p{margin:5px 0 0;font-size:.83rem;color:var(--fraco);font-weight:600;max-width:62ch}
@keyframes gira{to{transform:rotate(360deg)}}
@media(max-width:899px){
  .cabeca{padding:18px 14px 0}
  .cabeca h2{font-size:1.8rem}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<body>

<header class="topo">
  <div class="logo">
    <img id="selo-icone" alt="" width="36" height="36">
    <div>
      <strong>Milhas Plus</strong>
      <span>Grupo de extratos</span>
    </div>
  </div>
  <button class="tema" id="btTema" aria-pressed="false" title="Alternar claro e escuro">☾</button>
</header>

<main class="app">
<section class="pagina" id="pg-extratos">
<style>
#pg-extratos .abas{display:flex;gap:8px;flex-wrap:wrap;margin:16px 14px 0}
#pg-extratos .aba{flex:1 1 auto;font-family:inherit;text-align:center;padding:10px 12px;border-radius:999px;cursor:pointer;background:var(--card);border:1px solid var(--line);font-size:.86rem;font-weight:700;color:var(--fraco);white-space:nowrap}
#pg-extratos .aba:hover{color:var(--ink)}
#pg-extratos .aba[aria-current="true"]{background:var(--marca);border-color:rgb(var(--ac));color:var(--ink);box-shadow:inset 0 0 0 1px rgb(var(--ac))}
#pg-extratos .aba .ct{display:inline-block;margin-left:6px;padding:0 7px;border-radius:999px;background:var(--sup);font-size:.7rem;font-weight:800;color:var(--fraco)}
#pg-extratos .corpo{padding:0 14px}
#pg-extratos .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:16px 0}
#pg-extratos h3{font-size:1.02rem;font-weight:800;margin:22px 0 9px}
#pg-extratos .card>h3:first-child{margin-top:0}
#pg-extratos .corpo p{margin:8px 0;font-size:.86rem}
#pg-extratos .mut{color:var(--fraco)}
#pg-extratos .nota{font-size:.8rem;color:var(--fraco);font-weight:600}

#pg-extratos .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
#pg-extratos .kpi{background:var(--card);border:1px solid var(--line);border-left:4px solid rgb(var(--ac));border-radius:14px;padding:12px 15px}
#pg-extratos .kpi .k{font-size:.72rem;font-weight:800;color:var(--fraco);text-transform:uppercase;letter-spacing:.04em}
#pg-extratos .kpi .v{font-size:1.75rem;font-weight:800;color:rgb(var(--ac));line-height:1.2;margin-top:2px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}

<script>
(function(){
'use strict';
/* =====================================================================
   MP GRUPO DE EXTRATOS
   - Extratos do grupo: lidos do texto exportado do WhatsApp (linhas de conta
     e senha são descartadas). Cada dia subido fica salvo no servidor, na
     planilha de dados da ferramenta, e pode ser editado ou removido.
   - Planilha de vendas: lida online pelo fxLerPlanilha() do Código.gs,
     só as colunas A, B, C, E, F, G, L, M e U. Nada é gravado nela.
   - Cancelamento: vale o STATUS da planilha. A cancelada sai do fechamento
     (milhas e valor não contam) e entra a cobrança por CPF usado.
   ===================================================================== */
const root = document.getElementById('pg-extratos');
const $ = s => root.querySelector(s);
const ONLINE = typeof google !== 'undefined' && !!(google.script && google.script.run);

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const two = n => String(n).padStart(2, '0');
const fmtMi = n => Math.round(n).toLocaleString('pt-BR');
const fmtR = n => 'R$ ' + (Math.round(n * 100) / 100).toLocaleString('pt-BR', {minimumFractionDigits: 2, maximumFractionDigits: 2});
const fmtD = iso => { const p = iso.split('-'); return p[2] + '/' + p[1] + '/' + p[0]; };
// data curta para tabelas (dd/mm/aa) e telefone sem o +55, para as colunas caberem

const fmtDs = iso => { const p = iso.split('-'); return p[2] + '/' + p[1]; };
const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const DIAS = ['dom','seg','ter','qua','qui','sex','sáb'];
function norm(s) { return String(s).toLowerCase().normalize('NFD').replace(/\p{M}/gu, ''); }

/* ---------------- dados em memória ---------------- */

const CFG_PADRAO = {rate: 28, cpfFee: 125, dfmt: 'auto'};
let DB = {cfg: Object.assign({}, CFG_PADRAO), em: [], cx: [], cpf: {}, res: {}};   // res: pendências da conciliação já resolvidas
let SALVOS = [];                                        // {d, n, mi, tot, up}
const CAR = {estado: 'abrindo', erro: '', de: '', ate: '', seq: 0, dados: '', nome: '', atualizando: false};   // faixa carregada

/* ---------------- datas e períodos ---------------- */
function toUTC(iso) { const p = iso.split('-').map(Number); return new Date(Date.UTC(p[0], p[1] - 1, p[2])); }

function pkey(iso, g) { return g === 'dia' ? iso : g === 'sem' ? monday(iso) : iso.slice(0, 7); }
function prange(k, g) {

  if (g === 'sem') return [k, addDays(k, 6)];
  const p = k.split('-').map(Number);

function plabel(k, g) {

  if (g === 'sem') return fmtDs(k) + ' a ' + fmtD(addDays(k, 6));
  const p = k.split('-').map(Number);
  return MESES[p[1] - 1] + '/' + p[0];
}

/* ---------------- leitura do texto do WhatsApp ---------------- */
const RE_A = /^\[(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4}),?\s+(\d{1,2}):(\d{2})(?::(\d{2}))?(?:\s*([AP])\.?\s?M\.?)?\]\s?(.*)$/i;
const RE_B = /^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4}),?\s+(\d{1,2}):(\d{2})(?::(\d{2}))?(?:\s*([AP])\.?\s?M\.?)?\s+-\s(.*)$/i;
// marcas invisíveis de direção de texto que o WhatsApp põe na exportação
const RE_INVISIVEL = new RegExp('[' + [0x200e, 0x200f, 0x202a, 0x202b, 0x202c, 0x202d, 0x202e, 0xfeff].map(c => String.fromCharCode(c)).join('') + ']', 'g');

function parseChat(text, pref) {
  text = text.replace(/\r/g, '').replace(RE_INVISIVEL, '');
  const raw = [];
  for (const line of text.split('\n')) {
    let m = RE_A.exec(line), form = 'A';
    if (!m) { m = RE_B.exec(line); form = 'B'; }
    if (m) {
      raw.push({a: +m[1], b: +m[2], y: +m[3], H: +m[4], M: +m[5], S: +(m[6] || 0), ap: (m[7] || '').toUpperCase(), rest: m[8], form});
    } else if (raw.length) {
      raw[raw.length - 1].rest += '\n' + line;
    }
  }
  if (!raw.length) return {msgs: [], mdy: false, why: ''};

  // dia/mês ou mês/dia? evidência direta primeiro; depois a data mais próxima de hoje
  let mdy, why;
  if (pref === 'dmy' || pref === 'mdy') { mdy = pref === 'mdy'; why = 'definido nas configurações'; }
  else if (raw.some(r => r.a > 12)) { mdy = false; why = 'detectado'; }
  else if (raw.some(r => r.b > 12)) { mdy = true; why = 'detectado'; }
  else {
    const last = raw[raw.length - 1], lim = addDays(todayISO(), 1);
    const dD = mkDate(last, false).d, dM = mkDate(last, true).d;
    const okD = dD <= lim, okM = dM <= lim;
    if (okD !== okM) mdy = okM;
    else if (dD !== dM) mdy = okD ? dM > dD : dM < dD;
    else mdy = !!last.ap;
    why = 'deduzido pela data mais próxima de hoje';
  }

  const msgs = raw.map(r => {
    const dt = mkDate(r, mdy);
    const rest = r.rest, nl = rest.indexOf('\n'), first = nl < 0 ? rest : rest.slice(0, nl), tail = nl < 0 ? '' : rest.slice(nl);
    let sys = false, who = '', body = '';
    if (r.form === 'A' && first.startsWith('- ')) sys = true;
    else {
      const i = first.indexOf(': ');
      if (i > 0 && i <= 60) { who = first.slice(0, i).trim(); body = first.slice(i + 2) + tail; }
      else if (first.endsWith(':') && first.length <= 60) { who = first.slice(0, -1).trim(); body = tail; }
      else sys = true;
    }
    return {d: dt.d, h: dt.h, sys, who, body};
  });
  return {msgs, mdy, why};
}
function mkDate(r, mdy) {
  const mo = mdy ? r.a : r.b, da = mdy ? r.b : r.a, y = r.y < 100 ? 2000 + r.y : r.y;
  let H = r.H; if (r.ap) H = H % 12 + (r.ap === 'P' ? 12 : 0);
  return {d: y + '-' + two(mo) + '-' + two(da), h: two(H) + ':' + two(r.M) + ':' + two(r.S)};
}

/* ---------------- extração dos campos do extrato ---------------- */
function money(s) {
  s = s.replace(/[^\d.,]/g, '').replace(/[.,]+$/, '');

const RE_LOC = /\b(?:localizador|loc)[ \t]*:[ \t]*([A-Z0-9]{6})\b/i;
const RE_LOC_G = /\b(?:localizador|loc)[ \t]*:[ \t]*([A-Z0-9]{6})\b/gi;
const RE_RATE = [
  /x[ \t]*R\$[ \t]*(\d[\d.,]*)[ \t]*\/[ \t]*milheiro/i,
  /(?:milhas|pontos)[ \t]*:[ \t]*[\d.,]+[ \t]*[*x][ \t]*(?:R\$[ \t]*)?(\d[\d.,]*)/i,
  /milheiro[ \t]+a[ \t]+R\$[ \t]*(\d[\d.,]*)/i,
  /custo[ \t]+do[ \t]+milheiro[ \t]*:[ \t]*(?:R\$[ \t]*)?(\d[\d.,]*)/i,
  /milheiro[ \t]*:[ \t]*(?:R\$[ \t]*)?(\d[\d.,]*)/i,

  /(?:^|[^\d.,])(\d{1,2})[ \t]*cpfs?\b/i,

function fields(b) {

const LS_KEY = 'mp-grupo-extratos.dias.v3';

  const ler = () => { try { const o = JSON.parse(localStorage.getItem(LS_KEY) || 'null'); if (o && o.dias) { o.res = o.res || {}; return o; } } catch (e) {} return {dias: {}, cpf: {}, cfg: {}, res: {}}; };

// Toda chamada devolve uma Promise com a resposta já convertida; erro do servidor vira rejeição.

const SHEET_COLS = {d: 0, loc: 1, cp: 2, mi: 4, tx: 5, tot: 6, cia: 11, st: 12, resp: 15, cli: 20};

  for (const e of DB.em) {

    const s = c.find(x => x.mi != null && x.d === e.d) || c.find(x => x.mi != null) || c[0];

  const votos = {}, nomeDe = {};

// Nº de CPFs de uma cancelada: o que foi digitado; se nada foi digitado, o que veio no extrato do grupo.
function cpfsDe(key, e) {
  if (Object.prototype.hasOwnProperty.call(DB.cpf, key)) return {n: DB.cpf[key], manual: true};
  const n = e ? (e.cpf != null ? e.cpf : e.pax) : null;
  return {n: n == null ? null : n, manual: false};
}
// Emissões que estão SÓ NA PLANILHA e foram marcadas como resolvidas na Conciliação: entram no fechamento
// junto com as do grupo, com os valores da planilha. Ficam de fora as canceladas (essas cobram por CPF)
// e os lançamentos sem milhas (cobranças avulsas do mesmo localizador, como a do próprio cancelamento).
const kSop = s => 'sop|' + s.d + '|' + (s.loc || s.cp) + (s.mi == null ? '|sem-milhas' : '');
function daPlanilha(de, ate) {
  const o = [];
  for (const s of conciliar().soP) {
    if (s.d < de || s.d > ate || s.mi == null || isCanc(s) || DB.res[kSop(s)] === undefined) continue;
    o.push({k: 'p' + s.i, pl: 1, d: s.d, h: '', who: s.resp || 'Sem responsável', loc: s.loc, cp: s.cp, ped: '', mi: s.mi, tx: s.tx, tot: s.tot, bag: 0, rt: null, cpf: null, pax: null, ed: 0});
  }
  return o;
}
// Regra: emissão cancelada NA PLANILHA sai do fechamento (milhas e valor não contam)
// e, no lugar, entra a cobrança de DB.cfg.cpfFee por CPF usado.
function fechamento(de, ate) {
  const inD = d => d >= de && d <= ate, R = conciliar(), fee = DB.cfg.cpfFee;
  const zero = () => ({n: 0, mi: 0, tx: 0, tot: 0});
  const val = [], canc = [], bruto = zero(), desc = zero(), plan = zero();
  const item = (d, e, s) => { const key = s.loc || s.cp || (e ? e.loc || e.cp : ''), c = cpfsDe(key, e); return {key, d, e, s, cpfs: c.n, manual: c.manual, cob: c.n == null ? 0 : c.n * fee}; };
  for (const e of DB.em) {
    if (!inD(e.d)) continue;
    bruto.n++; bruto.mi += e.mi; bruto.tx += e.tx || 0; bruto.tot += T(e);
    const p = R.byKey.get(e.k);
    if (p && isCanc(p.s)) { desc.n++; desc.mi += e.mi; desc.tx += e.tx || 0; desc.tot += T(e); canc.push(item(e.d, e, p.s)); }
    else val.push(e);
  }
  // canceladas da planilha que nem foram postadas no grupo: nada a descontar, mas a cobrança por CPF vale
  for (const s of R.soP) if (isCanc(s) && inD(s.d)) canc.push(item(s.d, null, s));
  canc.sort((a, b) => b.d.localeCompare(a.d) || a.key.localeCompare(b.key));
  // só na planilha, resolvidas: somam nas emissões válidas
  for (const e of daPlanilha(de, ate)) { plan.n++; plan.mi += e.mi; plan.tx += e.tx || 0; plan.tot += T(e); val.push(e); }
  const liq = {n: bruto.n - desc.n + plan.n, mi: bruto.mi - desc.mi + plan.mi, tx: bruto.tx - desc.tx + plan.tx, tot: bruto.tot - desc.tot + plan.tot};
  let cmi = 0, cpfs = 0, cob = 0, pend = 0;
  for (const c of canc) { cmi += c.s.mi || 0; cpfs += c.cpfs || 0; cob += c.cob; if (c.cpfs == null) pend++; }
  return {de, ate, fee, val, canc, bruto, desc, plan, liq, cmi, cpfs, cob, pend, total: liq.tot + cob};
}

/* ----- Fechamento ----- */
function renderFech() {
  const main = $('#exMain');
  if (parar('Fechamento')) return;
  const p = UI.p, F = fechamento(p.de, p.ate), g = UI.gran, pronta = plPronta();
  // por período, dentro do período escolhido
  const G = new Map(), slot = k => { if (!G.has(k)) G.set(k, {val: [], canc: []}); return G.get(k); };
  for (const e of F.val) slot(pkey(e.d, g)).val.push(e);
  for (const c of F.canc) slot(pkey(c.d, g)).canc.push(c);
  let rows = '';
  for (const k of [...G.keys()].sort().reverse()) {
    const x = G.get(k), a = agg(x.val), open = UI.open === k;
    let cpfs = 0, cob = 0; for (const c of x.canc) { cpfs += c.cpfs || 0; cob += c.cob; }
    rows += `<tr class="click ${open ? 'open' : ''}" data-act="open" data-k="${k}">
      <td class="b">${open ? '▾' : '▸'} ${esc(plabel(k, g))}</td><td class="n">${fmtMi(a.n)}</td><td class="n b">${fmtMi(a.mi)}</td>
      <td class="n">${fmtR(a.tx)}</td><td class="n">${fmtR(a.tot)}</td>
      <td class="n">${x.canc.length || '—'}</td><td class="n">${x.canc.length ? fmtMi(cpfs) : '—'}</td><td class="n">${x.canc.length ? fmtR(cob) : '—'}</td>
      <td class="n b">${fmtR(a.tot + cob)}</td></tr>`;
    if (open) rows += `<tr class="det"><td colspan="9">${detail(x.val, k, g)}</td></tr>`;
  }
  const comp = (nome, n, mi, tx, tot, cls) => `<tr class="${cls || ''}"><td class="b">${nome}</td><td class="n">${n}</td><td class="n">${mi}</td><td class="n">${tx}</td><td class="n b">${tot}</td></tr>`;
  const lista = UI.pdfLista == null ? F.val.length <= 600 : UI.pdfLista;

    ${avisoPl()}
    <div class="kpis">
      <div class="kpi"><div class="k">Total do fechamento</div><div class="v">${fmtR(F.total)}</div>
        <div class="s">${fmtR(F.liq.tot)} em emissões${F.canc.length ? `<br>+ ${fmtR(F.cob)} de cancelamentos` : ''}</div></div>
      <div class="kpi"><div class="k">Milhas usadas</div><div class="v">${fmtMi(F.liq.mi)}</div>
        <div class="s">${plural(F.liq.n, 'emissão válida', 'emissões válidas')}${F.plan.n ? ` · ${F.plan.n} só da planilha` : ''}<br>taxas ${fmtR(F.liq.tx)}</div></div>
      <div class="kpi"><div class="k">Canceladas na planilha</div><div class="v">${fmtMi(F.canc.length)}</div>
        <div class="s">${fmtMi(F.cmi)} milhas não contadas<br>${plural(F.cpfs, 'CPF', 'CPFs')} × ${fmtR(F.fee)} = ${fmtR(F.cob)}${F.pend ? `<br><b style="color:var(--alerta)">${F.pend} sem CPF informado</b>` : ''}</div></div>
    </div>
    <div class="row between" style="margin:18px 0 0">
      <h3 style="margin:0">Composição do fechamento · ${fmtD(p.de)} a ${fmtD(p.ate)}</h3>
      <div class="row">
        <label class="chk"><input type="checkbox" id="exPdfLista" ${lista ? 'checked' : ''}>Listar cada emissão no PDF</label>
        <button class="btn" data-act="pdf" ${pronta && !UI.pdf ? '' : 'disabled'}>${UI.pdf ? 'Gerando PDF…' : 'Baixar PDF do período'}</button>
      </div>
    </div>
    ${UI.pdfUrl ? `<p class="nota" style="text-align:right;margin:4px 0 0"><a href="${UI.pdfUrl}" download="${esc(UI.pdfNome)}" style="color:rgb(var(--ac));font-weight:800">Se o download não começou, clique aqui para abrir “${esc(UI.pdfNome)}”</a></p>` : ''}
    <div class="tw" style="margin-top:9px"><table>
      <thead><tr><th></th><th class="n">Emissões</th><th class="n">Milhas</th><th class="n">Taxas</th><th class="n">Valor</th></tr></thead>
      <tbody>
        ${comp('Postado no grupo', fmtMi(F.bruto.n), fmtMi(F.bruto.mi), fmtR(F.bruto.tx), fmtR(F.bruto.tot))}
        ${comp('(−) Canceladas na planilha', fmtMi(F.desc.n), fmtMi(F.desc.mi), fmtR(F.desc.tx), F.desc.n ? '−' + fmtR(F.desc.tot) : fmtR(0), 'canc')}
        ${F.plan.n ? comp('(+) Só na planilha, resolvidas', fmtMi(F.plan.n), fmtMi(F.plan.mi), fmtR(F.plan.tx), fmtR(F.plan.tot)) : ''}

    </table></div>` : `<div class="card empty">Nenhum dia salvo neste período.</div>`}
    <h3>Canceladas do período · CPFs para a cobrança</h3>

  bar(`Fechamento · ${fmtD(p.de)} a ${fmtD(p.ate)}`, [['Emissões válidas', fmtMi(F.liq.n)], ['Milhas usadas', fmtMi(F.liq.mi)], ['Cancelamentos', fmtR(F.cob)], ['Total', fmtR(F.total)]]);
}
function detail(list, k, g) {
  const by = new Map();
  for (const e of list) { const w = emissor(e); if (!by.has(w)) by.set(w, []); by.get(w).push(e); }
  const rows = [...by.entries()].map(([w, l]) => [w, agg(l)]).sort((a, b) => b[1].tot - a[1].tot)
    .map(([w, a]) => `<tr><td class="b">${quem(w)}</td><td class="n">${fmtMi(a.n)}</td><td class="n">${fmtMi(a.mi)}</td><td class="n">${fmtR(a.tx)}</td><td class="n b">${fmtR(a.tot)}</td></tr>`).join('');
  return `<div style="margin-bottom:10px"><b>${esc(plabel(k, g))} · emissões válidas por emissor</b></div>
    ${rows ? `<div class="tw"><table><thead><tr><th>Emissor</th><th class="n">Emissões</th><th class="n">Milhas usadas</th><th class="n">Taxas</th><th class="n">Total</th></tr></thead><tbody>${rows}</tbody></table></div>` : '<div class="empty">Só canceladas neste período.</div>'}`;
}

  return todas.filter(e => {

      const nums = [e.mi, Math.round(T(e) * 100), Math.round((e.tx || 0) * 100), e.ped].join(' ');

}

/* ----- Conciliação ----- */
// Três listas de pendência (divergentes, só no grupo, só na planilha), cada linha com o emissor
// responsável e o botão "Resolvido". A marca fica salva no servidor junto com a situação que foi
// resolvida: se a divergência mudar depois, a linha volta a aparecer como pendente.
const VIEWS = [['div', 'Divergentes'], ['sog', 'Só no grupo'], ['sop', 'Só na planilha'], ['res', 'Resolvidos'], ['ok', 'Conferem']];
const PEND = ['div', 'sog', 'sop'];
const kDiv = x => 'div|' + x.e.d + '|' + (x.e.loc || x.e.cp);
const sDiv = x => x.dif.map(y => y.txt).join(' · ');
const kSog = e => 'sog|' + e.d + '|' + (e.loc || e.cp);
// item da lista "só na planilha" que, resolvido, soma no fechamento (tem milhas e não está cancelado)
const vaiF = it => it.k.indexOf('sop|') === 0 && !!it.s && it.s.mi != null && !isCanc(it.s);

function listasConc() {
  const f = UI.c, p = UI.p, R = conciliar(), res = DB.res;
  const inD = d => d >= p.de && d <= p.ate;
  // online, o servidor já entrega só o cliente do grupo; o filtro daqui vale para a planilha colada (teste)
  const okCli = s => PL.clientes.length ? true : f.cli === 'auto' ? (!R.clis.size || R.clis.has(s.cli)) : (!f.cli || s.cli === f.cli);
  const inS = s => inD(s.d) && okCli(s) && (!f.cia || s.cia === f.cia);
  const L = {div: [], sog: [], sop: [], res: [], ok: []};
  for (const x of R.pairs) {
    if (!inD(x.e.d)) continue;
    if (!x.dif.length) { L.ok.push(x); continue; }
    const k = kDiv(x), sig = sDiv(x);
    if (res[k] === sig) L.res.push({t: 'div', k, d: x.e.d, sig, e: x.e, s: x.s});
    else L.div.push({k, d: x.e.d, sig, x, mudou: res[k] !== undefined});
  }
  for (const e of R.soG) {
    if (!inD(e.d)) continue;
    const k = kSog(e);
    if (res[k] !== undefined) L.res.push({t: 'sog', k, d: e.d, sig: 'só no grupo', e, s: null});
    else L.sog.push({k, d: e.d, sig: 'só no grupo', e});
  }
  for (const s of R.soP) {
    if (!inS(s)) continue;
    const k = kSop(s);
    if (res[k] !== undefined) L.res.push({t: 'sop', k, d: s.d, sig: 'só na planilha', e: null, s, fim: isCanc(s) ? 'cancelada · cobra por CPF' : s.mi == null ? 'lançamento sem milhas · não soma' : 'entrou no fechamento'});
    else L.sop.push({k, d: s.d, sig: 'só na planilha', s});
  }
  L.res.sort((a, b) => b.d.localeCompare(a.d) || a.k.localeCompare(b.k));
  return {L, R, inD, inS};
}
// marca como resolvido (ou reabre, com sig vazio), grava no servidor e relê a planilha por trás
let resVoo = 0;
function resolver(itens) {
  if (!itens.length) return;
  for (const it of itens) { resOver[it.k] = it.s; if (it.s) DB.res[it.k] = it.s; else delete DB.res[it.k]; }
  resVoo++; UI.resTodos = ''; if (CAR.estado === 'ok') CAR.atualizando = true; render();
  const n = itens.length, reabriu = !itens[0].s, nf = itens.filter(it => it.f).length;
  const fim = erro => {
    if (erro) recado('Não consegui gravar a marca: ' + erro + '. A lista voltou ao que está salvo.');
    if (--resVoo > 0) return;                       // ainda há marcas a caminho: a releitura fica para a última
    for (const k in resOver) delete resOver[k];
    abrir(false, true, erro ? null : () => recado((reabriu ? 'Reaberta' : n > 1 ? n + ' marcadas como resolvidas' : 'Marcada como resolvida') + (nf ? (reabriu ? ' · saiu do fechamento' : ' · ' + (nf === 1 ? 'entrou' : nf + ' entraram') + ' no fechamento') : '') + ' · planilha relida' + (PL.lidoEm ? ' às ' + PL.lidoEm.toTimeString().slice(0, 5) : '') + '.'));
  };
  chamar('fxResolver', JSON.stringify(itens.map(it => ({k: it.k, d: it.d, s: it.s})))).then(() => fim(''), err => fim(err.message));
}

/* subir: o texto vira uma prévia por dia; só o que for marcado é salvo */
function looksLikeSheet(text) {
  const head = text.replace(/\r/g, '').split('\n', 8);
  return head.some(l => l.split('\t').length >= 7) && !head.some(l => RE_A.test(l) || RE_B.test(l));
}
function runImport(text) {
  UI.msg = '';
  if (CAR.estado !== 'ok') { recado('Espere os dias salvos terminarem de abrir'); return; }
  if (looksLikeSheet(text)) {
    if (!ONLINE) return runSheet(text);
    UI.pre = {err: 'Esse texto parece ser da planilha. Ela é lida online, não precisa colar: aqui entra só o texto exportado do grupo.'}; render(); return;
  }
  const p = parseChat(text, DB.cfg.dfmt);
  if (!p.msgs.length) { UI.pre = {err: 'Não parece a exportação do grupo do WhatsApp.'}; render(); return; }
  const x = extract(p.msgs);
  if (!x.em.length) { UI.pre = {err: 'Li ' + x.nmsg + ' mensagens, mas não encontrei nenhum extrato de emissão nelas.'}; render(); return; }
  const porDia = new Map(), dia = d => { if (!porDia.has(d)) porDia.set(d, {d, em: new Map(), cx: new Map()}); return porDia.get(d); };
  for (const e of x.em) {            // mesmo localizador postado duas vezes no dia: vale o último, com a hora do primeiro
    const m = dia(e.d).em, k = e.loc || e.cp || (e.who + '|' + e.mi + '|' + e.tot), ant = m.get(k);
    m.set(k, {h: ant ? ant.h : e.h, who: e.who, loc: e.loc, cp: e.cp, ped: e.ped, mi: e.mi, tx: e.tx, tot: e.tot, bag: e.bag || 0, rt: e.rt, cpf: e.cpf, pax: e.pax, ed: 0});
  }
  for (const c of x.canc) if (porDia.has(c.d)) dia(c.d).cx.set(c.loc || c.cp || c.ped, {h: c.h, who: c.who, loc: c.loc, cp: c.cp, ped: c.ped});
  const salvo = new Map(SALVOS.map(s => [s.d, s]));
  const dias = [...porDia.values()].sort((a, b) => b.d.localeCompare(a.d)).map(o => {
    const em = [...o.em.values()].sort((a, b) => a.h.localeCompare(b.h)), cx = [...o.cx.values()];
    let mi = 0, tot = 0; for (const e of em) { mi += e.mi; tot += T(e); }
    tot = Math.round(tot * 100) / 100;
    const sv = salvo.get(o.d) || null;
    const st = !sv ? 'novo' : (sv.n === em.length && sv.mi === mi && Math.abs(sv.tot - tot) < 0.01) ? 'igual' : 'dif';
    return {d: o.d, em, cx, mi, tot, sv, st, on: st === 'novo'};
  });
  UI.pre = {dias, nmsg: x.nmsg, apag: x.apag, skipped: x.skipped, mdy: p.mdy, why: p.why};
  UI.tab = 'dias'; render(); window.scrollTo(0, 0);
}
function salvarPre() {
  const sel = UI.pre.dias.filter(x => x.on);
  if (!sel.length || UI.salvando) return;
  UI.salvando = true; render();
  const payload = sel.map(x => ({d: x.d, em: x.em.map(paraLinha), cx: x.cx.map(c => [c.h, c.who, c.loc, c.cp, c.ped])}));
  chamar('fxSalvarDias', JSON.stringify(payload)).then(() => {
    UI.salvando = false; UI.pre = null;
    UI.msg = plural(sel.length, 'dia salvo', 'dias salvos') + ': ' + sel.map(x => fmtD(x.d)).reverse().join(', ') + '.';
    abrir(true);
  }, err => { UI.salvando = false; render(); recado('Não consegui salvar: ' + err.message); });
}
function runSheet(text) {
  const p = parseSheet(text);
  if (!p.rows.length) { UI.pre = {err: 'Não encontrei linhas de planilha com data e localizador neste texto.'}; render(); return; }
  const ds = p.rows.map(r => r.d).sort();
  PL.rows = p.rows; PL.de = ds[0]; PL.ate = ds[ds.length - 1]; PL.abas = []; PL.estado = 'colada';
  UI.pre = {kind: 'sheet', linhas: p.rows.length, ign: p.ign};
  UI.c.view = '';
  render(); window.scrollTo(0, 0);
}
async function importFiles(files) {
  let text = '';
  for (const f of files) text += (await f.text()) + '\n';
  runImport(text);
}
function removerDia(d) {
  UI.rm = ''; UI.msg = '';
  chamar('fxRemoverDia', d).then(() => { UI.msg = 'Dia ' + fmtD(d) + ' removido.'; abrir(!SALVOS.some(s => s.d !== d && s.d >= CAR.de && s.d <= CAR.ate)); },
    err => { render(); recado('Não consegui remover: ' + err.message); });
  recado('Removendo o dia ' + fmtD(d) + '…');
}

/* editar um dia salvo: mexe numa cópia; só vale depois de "Salvar alterações" */
function abrirEditor(d) {
  UI.ed = {d, estado: 'lendo', rows: [], erros: new Set(), sujo: false}; UI.msg = ''; render();
  chamar('fxLerDia', d).then(r => {
    if (!UI.ed || UI.ed.d !== d) return;
    UI.ed.rows = r.em.map(l => ({h: l[1], who: l[2], loc: l[3], cp: l[4], ped: l[5], mi: fmtMi(l[6] || 0), tx: nv(l[7]), tot: nv(l[8]), bag: l[9] || 0, rt: l[10], cpf: l[11] == null ? '' : String(l[11]), pax: l[12], ed: l[13] ? 1 : 0}))
      .sort((a, b) => a.h.localeCompare(b.h));
    UI.ed.estado = 'ok'; render();
  }, err => { UI.ed = null; render(); recado('Não consegui abrir o dia: ' + err.message); });
}
function renderEditor() {
  const ed = UI.ed, main = $('#exMain');
  if (ed.estado === 'lendo') { main.innerHTML = `<div class="card carregando"><div class="spin"></div>Abrindo o dia ${fmtD(ed.d)}…</div>`; bar('Editar dia', []); return; }
  const campo = (i, f, v, cls, ph) => `<input class="ed ${cls}" data-i="${i}" data-f="${f}" value="${esc(v)}" placeholder="${ph || ''}" ${f === 'mi' || f === 'cpf' ? 'inputmode="numeric"' : f === 'tx' || f === 'tot' ? 'inputmode="decimal"' : ''} aria-label="${f} da linha ${i + 1}">`;
  const rows = ed.rows.map((r, i) => `<tr class="${ed.erros.has(i) ? 'err' : ''}">
      <td>${r.h ? r.h.slice(0, 5) : '—'}<br><span class="sub">${quem(r.who)}${r.ed ? ' · editada' : ''}</span></td>
      <td>${campo(i, 'loc', r.loc, 'loc', 'ABC123')}</td><td>${campo(i, 'cp', r.cp, 'cp', 'LA…')}</td><td>${campo(i, 'ped', r.ped, 'ped')}</td>
      <td class="n">${campo(i, 'mi', r.mi, 'num')}</td><td class="n">${campo(i, 'tx', r.tx, 'num')}</td><td class="n">${campo(i, 'tot', r.tot, 'num', 'calcula')}</td><td class="n">${campo(i, 'cpf', r.cpf, 'cpfs')}</td>
      <td><button class="btn sm danger" data-act="edrm" data-k="${i}" title="Tirar esta emissão do dia">Tirar</button></td></tr>`).join('');
  const sal = ed.estado === 'salvando';
  main.innerHTML = `
    <div class="row between" style="margin:16px 0 10px">
      <h3 style="margin:0">Editar o dia ${esc(plabel(ed.d, 'dia'))} · ${plural(ed.rows.length, 'emissão', 'emissões')}</h3>
      <div class="row">
        <button class="btn ghost" data-act="edadd" ${sal ? 'disabled' : ''}>+ Adicionar emissão</button>
        <button class="btn" data-act="edsave" ${sal ? 'disabled' : ''}>${sal ? 'Salvando…' : 'Salvar alterações'}</button>
        <button class="btn ghost" data-act="edcancel" ${sal ? 'disabled' : ''}>Cancelar</button>
      </div>
    </div>
    ${ed.erros.size ? `<div class="aviso erro">${plural(ed.erros.size, 'linha marcada precisa', 'linhas marcadas precisam')} de localizador (ou compra) e de milhas em número.</div>` : ''}
    ${ed.rows.length ? `<div class="tw"><table class="edit">
      <thead><tr><th>Hora · emissor</th><th>Localizador</th><th>Compra</th><th>Pedido</th><th class="n">Milhas</th><th class="n">Taxas (R$)</th><th class="n">Total (R$)</th><th class="n">CPFs</th><th></th></tr></thead>
      <tbody>${rows}</tbody></table></div>` : `<div class="card empty">Nenhuma emissão neste dia. Adicione uma, ou cancele e use “Remover” na lista de dias para apagar o dia.</div>`}
    <p class="nota">Nada muda no que está salvo até você clicar em “Salvar alterações”. Total em branco é calculado pelo milheiro (milhas × milheiro + taxas). Esta tela mexe só nos extratos do grupo; a planilha de vendas não é alterada.</p>`;
  bar('Editando ' + fmtD(ed.d), [['Emissões', fmtMi(ed.rows.length)], ['Situação', ed.sujo ? 'alterações não salvas' : 'sem alterações']]);
}
function salvarEditor() {
  const ed = UI.ed; if (!ed || ed.estado !== 'ok') return;
  if (!ed.rows.length) { recado('O dia ficou sem emissões: use “Remover” na lista de dias'); return; }
  ed.erros = new Set();
  const em = ed.rows.map((r, i) => {
    const loc = r.loc.trim().toUpperCase(), cp = r.cp.trim().toUpperCase(), miTxt = String(r.mi).replace(/[.\s]/g, '');
    const mi = /^\d+$/.test(miTxt) ? parseInt(miTxt, 10) : NaN;
    const tx = String(r.tx).trim() === '' ? null : money(String(r.tx)), tot = String(r.tot).trim() === '' ? null : money(String(r.tot));
    const cpfTxt = String(r.cpf).trim(), cpf = cpfTxt === '' ? null : parseInt(cpfTxt, 10);
    if ((!loc && !cp) || isNaN(mi) || (cpf !== null && !(cpf >= 0)) || (String(r.tx).trim() !== '' && tx === null) || (String(r.tot).trim() !== '' && tot === null)) ed.erros.add(i);
    return [r.h, r.who, loc, cp, r.ped.trim(), mi, tx, tot, r.bag || 0, r.rt, cpf, r.pax, r.ed ? 1 : 0];
  });
  if (ed.erros.size) { render(); return; }
  ed.estado = 'salvando'; render();
  chamar('fxSalvarDias', JSON.stringify([{d: ed.d, em, cx: null}])).then(() => {
    UI.msg = 'Dia ' + fmtD(ed.d) + ' salvo com ' + plural(em.length, 'emissão', 'emissões') + '.'; UI.ed = null; abrir(false);
  }, err => { ed.estado = 'ok'; render(); recado('Não consegui salvar: ' + err.message); });
}

/* ---------------- eventos ---------------- */
root.addEventListener('click', ev => {
  const t = ev.target.closest('[data-tab],[data-act]'); if (!t || !root.contains(t) || t.disabled) return;
  if (t.dataset.tab) {
    if (UI.ed && UI.ed.sujo) { recado('Salve ou cancele a edição do dia antes de sair'); return; }
    UI.tab = t.dataset.tab; UI.ed = null; UI.rm = ''; render(); return;
  }
  const a = t.dataset.act, k = t.dataset.k;
  if (a === 'gran') { UI.gran = k; UI.open = null; render(); }
  else if (a === 'open') { UI.open = UI.open === k ? null : k; render(); }
  else if (a === 'atalho') { const r = faixaAtalho(k); mudarPeriodo(r[0], r[1]); }
  else if (a === 'clearf') { Object.assign(UI.f, {who: '', q: '', al: false, lim: 300}); render(); }
  else if (a === 'more') { UI.f.lim += 300; drawEm(); }
  else if (a === 'paste') { const v = $('#exPaste').value; if (v.trim()) runImport(v); else recado('Cole o texto do grupo primeiro'); }
  else if (a === 'pasteS') { const v = $('#exPasteS').value; if (v.trim()) runSheet(v); else recado('Cole as linhas da planilha primeiro'); }
  else if (a === 'presave') salvarPre();
  else if (a === 'predrop') { UI.pre = null; render(); }
  else if (a === 'diaed') abrirEditor(k);
  else if (a === 'diarm') {
    if (UI.rm !== k) { UI.rm = k; render(); setTimeout(() => { if (UI.rm === k) { UI.rm = ''; if (UI.tab === 'dias' && !UI.ed) render(); } }, 5000); }
    else removerDia(k);
  }
  else if (a === 'edadd') { UI.ed.rows.unshift({h: '', who: 'adicionada à mão', loc: '', cp: '', ped: '', mi: '', tx: '', tot: '', bag: 0, rt: null, cpf: '', pax: null, ed: 1}); UI.ed.erros = new Set(); UI.ed.sujo = true; render(); const el = $('input.ed'); if (el) el.focus(); }
  else if (a === 'edrm') { UI.ed.rows.splice(+k, 1); UI.ed.erros = new Set(); UI.ed.sujo = true; render(); }
  else if (a === 'edsave') salvarEditor();
  else if (a === 'edcancel') { UI.ed = null; render(); }
  else if (a === 'cview') { UI.c.view = k; UI.resTodos = ''; drawConc(); }
  else if (a === 'res1' || a === 'reabrir' || a === 'restodos') {
    const L = listasConc().L;
    if (a === 'res1') { const it = PEND.map(v => L[v]).flat().find(x => x.k === k); if (it) resolver([{k: it.k, d: it.d, s: it.sig, f: vaiF(it)}]); }
    else if (a === 'reabrir') { const it = L.res.find(x => x.k === k); if (it) resolver([{k: it.k, d: it.d, s: '', f: vaiF(it)}]); }
    else if (UI.resTodos !== k) { UI.resTodos = k; drawConc(); setTimeout(() => { if (UI.resTodos === k) { UI.resTodos = ''; if (UI.tab === 'conc' && CAR.estado === 'ok') drawConc(); } }, 6000); }
    else resolver(L[k].map(it => ({k: it.k, d: it.d, s: it.sig, f: vaiF(it)})));
  }
  else if (a === 'plreload' || a === 'recarregar') abrir(!UI.p.de);
  else if (a === 'pdf') baixarPdf();
});
root.addEventListener('input', ev => {
  const el = ev.target;
  if (el.id === 'exFQ') { UI.f.q = el.value; UI.f.lim = 300; drawEm(); }
  else if (el.classList.contains('ed') && UI.ed) {          // edição de um campo: guarda sem redesenhar, para não perder o foco
    const r = UI.ed.rows[+el.dataset.i]; if (!r) return;
    r[el.dataset.f] = el.value; r.ed = 1;
    if (!UI.ed.sujo) { UI.ed.sujo = true; bar('Editando ' + fmtD(UI.ed.d), [['Emissões', fmtMi(UI.ed.rows.length)], ['Situação', 'alterações não salvas']]); }
  }
});
root.addEventListener('change', ev => {
  const el = ev.target, id = el.id;
  if (el.dataset && el.dataset.cpf !== undefined) {          // CPFs usados em uma cancelada
    const key = el.dataset.cpf, v = el.value.trim(), n = parseInt(v, 10), vale = v !== '' && n >= 0;
    if (vale) DB.cpf[key] = n; else delete DB.cpf[key];
    render();
    chamar('fxSalvarCpf', key, vale ? n : '').catch(err => recado('Não consegui salvar os CPFs de ' + key + ': ' + err.message));
    return;
  }
  if (el.dataset && el.dataset.pre !== undefined) { UI.pre.dias[+el.dataset.pre].on = el.checked; render(); return; }
  if (id === 'exPDe' || id === 'exPAte') {
    if (!el.value) return;
    let de = UI.p.de, ate = UI.p.ate;
    if (id === 'exPDe') { de = el.value; if (ate < de) ate = de; } else { ate = el.value; if (de > ate) de = ate; }
    mudarPeriodo(de, ate);
  }
  else if (id === 'exPdfLista') UI.pdfLista = el.checked;
  else if (id === 'exFWho') { UI.f.who = el.value; drawEm(); }
  else if (id === 'exFAl') { UI.f.al = el.checked; drawEm(); }
  else if (id === 'exKCli') { UI.c.cli = el.value; drawConc(); }
  else if (id === 'exKCia') { UI.c.cia = el.value; drawConc(); }
  else if (id === 'exCfgRate' || id === 'exCfgCpf' || id === 'exCfgFmt') {
    const v = parseFloat(el.value);
    if (id === 'exCfgRate') { if (!(v > 0)) return; DB.cfg.rate = v; }
    else if (id === 'exCfgCpf') { if (!(v >= 0)) return; DB.cfg.cpfFee = v; }
    else DB.cfg.dfmt = el.value;
    chamar('fxSalvarCfg', JSON.stringify(DB.cfg)).then(() => recado('Configuração salva'), err => recado('Não consegui salvar a configuração: ' + err.message));
  }
  else if (id === 'exFile') { if (el.files.length) importFiles([...el.files]); }
});
root.addEventListener('dragover', ev => { const d = ev.target.closest && ev.target.closest('#exDrop'); if (d) { ev.preventDefault(); d.classList.add('over'); } });
root.addEventListener('dragleave', ev => { const d = ev.target.closest && ev.target.closest('#exDrop'); if (d) d.classList.remove('over'); });
root.addEventListener('drop', ev => { const d = ev.target.closest && ev.target.closest('#exDrop'); if (d) { ev.preventDefault(); d.classList.remove('over'); if (ev.dataTransfer.files.length) importFiles([...ev.dataTransfer.files]); } });
window.addEventListener('beforeunload', ev => { if (UI.ed && UI.ed.sujo) { ev.preventDefault(); ev.returnValue = ''; } });

/* ---------------- início ---------------- */
abrir(true);
})();
</script>

</main>

<!-- ==================== CASCA: ÍCONE E TEMA ==================== -->
<script>
(function(){
  'use strict';
  const CHAVE = 'mp-extratos-casca';
  let escuro = false;
  document.getElementById('selo-icone').src = ICONE;
  function aplicarTema(){
    document.body.classList.toggle('escuro', escuro);
    const bt = document.getElementById('btTema');
    bt.textContent = escuro ? '☀' : '☾';
    bt.setAttribute('aria-pressed', escuro ? 'true' : 'false');
  }
  document.getElementById('btTema').addEventListener('click', () => {
    escuro = !escuro; aplicarTema();
    try{ localStorage.setItem(CHAVE, JSON.stringify({escuro})); }catch(e){}
  });
  let salvo = null;
  try{ salvo = JSON.parse(localStorage.getItem(CHAVE) || 'null'); }catch(e){}
  if(salvo && typeof salvo.escuro === 'boolean') escuro = salvo.escuro;
  else if(window.matchMedia) escuro = window.matchMedia('(prefers-color-scheme: dark)').matches;
  aplicarTema();
})();
</script>
